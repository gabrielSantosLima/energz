name: Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the APK to (e.g. v0.0.1)"
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach the APK to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          shopt -s nullglob
          files=(android/app/build/outputs/apk/release/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No APK found"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
